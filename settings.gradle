pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '9.2.1' apply false
        id 'com.android.library' version '9.2.1' apply false

        id 'org.jetbrains.kotlin.android' version '2.3.21' apply false
        id 'org.jetbrains.kotlin.kapt' version '2.3.21' apply false
        id 'org.jetbrains.kotlin.plugin.parcelize' version '2.3.21' apply false

        // Kotlin 2.x 强制要求的独立 Compose 编译器插件
        id 'org.jetbrains.kotlin.plugin.compose' version '2.3.21' apply false

        // 老版本的 SonarQube 会在 Gradle 9 崩溃，必须升级
        id 'org.sonarqube' version '7.3.0.8198' apply false
    }

}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    // PREFER_SETTINGS 允许子模块和复合构建项目在过渡期内拥有自己的仓库配置
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://clojars.org/repo" }
    }
}

rootProject.name = "PipePipe"

include ':app'
include ':ffmpeg'

includeBuild('../PipePipeExtractor') {
    dependencySubstitution {
        substitute module('com.github.TeamNewPipe:NewPipeExtractor') using project(':extractor')
    }
}
